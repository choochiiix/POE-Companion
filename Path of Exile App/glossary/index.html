<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master glossary</title><style>
:root{color-scheme:dark;font:15px 'Segoe UI',sans-serif;background:#0a0e14;color:#e6e1d9}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1500px;margin:auto}h1{margin:0 0 8px}p{line-height:1.6;color:#b3b1ad}input,select,button{font:inherit;background:#151b22;color:inherit;border:1px solid #737e89;border-radius:8px;padding:10px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #ffb454;outline-offset:3px}a{color:#59c2ff}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.toolbar label{display:grid;gap:8px}.toolbar label:first-child{flex:1;min-width:220px}main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px}nav{display:grid;align-content:start;gap:8px}nav button{text-align:left}nav button[aria-pressed=true]{border-color:#ffb454;background:#33291b}nav small{display:block;color:#b3b1ad;margin-top:4px}article{background:#151b22;padding:24px;border:1px solid #38424c;border-radius:12px;align-self:start;position:sticky;top:20px;overflow-wrap:anywhere}article h2{color:#ffb454;margin:0 0 12px}.badge{display:inline-block;border:1px solid #737e89;padding:4px 8px;border-radius:6px;font-size:12px}.definition{font-size:18px;line-height:1.8;color:#e6e1d9}footer{display:flex;gap:16px;align-items:center;margin:24px 0}pre{white-space:pre-wrap;font-size:12px}#resultCount{color:#b3b1ad}@media(max-width:700px){body{padding:16px}main{grid-template-columns:1fr}article{position:static;grid-row:1}nav{max-height:400px;overflow:auto}}
</style><h1>Master glossary</h1><p id="summary">Loading local glossary…</p><p>This is the actual source catalog. Drafts are available for research; only reviewed entries qualify for future tooltip matching. Nothing here changes the companion’s cards.</p><div class="toolbar"><label>Search names, aliases and definitions<input id="search" type="search" placeholder="Burning Ground, movement speed, Icestorm…"></label><label>Review status<select id="status"><option value="reviewed">Reviewed starter definitions</option><option value="">All entries</option><option value="source-extracted">Source-extracted drafts</option><option value="needs-extraction">Needs extraction</option><option value="skill">Gem descriptions</option><option value="granted-skill">Item-granted skills</option></select></label></div><p id="resultCount" role="status"></p><main><nav id="list" aria-label="Glossary entries"></nav><article id="detail" aria-live="polite"></article></main><footer><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></footer><script type="module">
const $=id=>document.getElementById(id);let data,filtered=[],selected='',offset=0;const size=40;
function el(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
function inspect(entry){selected=entry.id;const root=$('detail');root.replaceChildren();el('h2',entry.name,root);el('span',entry.status==='reviewed'?'Reviewed starter definition':'Draft · not enabled for tooltips',root).className='badge';el('p',entry.definition||'No clean definition extracted yet. Source needs editorial work.',root).className='definition';el('p',`ID: ${entry.id}`,root);el('p',`Aliases: ${entry.aliases.join(', ')}`,root);el('p',`Kind: ${entry.kind} · ${entry.references.length} references in app source records`,root);el('h3','Sources',root);for(const source of entry.sources){if(source.url){const a=el('a',source.url,root);a.href=source.url;a.target='_blank';a.rel='noreferrer';el('p',`Revision ${source.revision} · ${source.timestamp} · ${source.license}`,root)}else el('p',`${source.path} · ${source.record}`,root)}const details=el('details','',root);el('summary','Source references and full record',details);el('pre',JSON.stringify(entry,null,2),details);document.querySelectorAll('#list button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===selected)))}
function render(){const query=$('search').value.toLowerCase().trim(),status=$('status').value;filtered=data.entries.filter(e=>(!status||e.status===status||e.kind===status)&&[e.name,...e.aliases,e.definition].join(' ').toLowerCase().includes(query)).sort((a,b)=>a.name.localeCompare(b.name));const list=$('list');list.replaceChildren();for(const entry of filtered.slice(offset,offset+size)){const b=el('button',entry.name,list);b.type='button';b.dataset.id=entry.id;b.setAttribute('aria-pressed',String(entry.id===selected));el('small',`${entry.kind} · ${entry.status}`,b);b.onclick=()=>inspect(entry)}$('resultCount').textContent=`${filtered.length} matching entries`;$('page').textContent=`Page ${Math.floor(offset/size)+1} of ${Math.max(1,Math.ceil(filtered.length/size))}`;$('previous').disabled=offset===0;$('next').disabled=offset+size>=filtered.length;if(!filtered.some(e=>e.id===selected)&&filtered.length)inspect(filtered[0]);if(!filtered.length)$('detail').textContent='No entries match these filters.'}
for(const id of ['search','status'])$(id).oninput=()=>{offset=0;render()};$('previous').onclick=()=>{offset=Math.max(0,offset-size);render()};$('next').onclick=()=>{offset+=size;render()};try{const r=await fetch('/master.json');if(!r.ok)throw Error();data=await r.json();$('summary').textContent=`${data.entries.length.toLocaleString()} entries · ${data.entries.filter(e=>e.status==='reviewed').length} reviewed starter definitions · local offline snapshot`;render()}catch{$('summary').textContent='Could not load local master.json. Start the glossary viewer server and refresh.'}
</script></html>
